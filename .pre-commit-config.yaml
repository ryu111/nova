# 這個檔案刻意只有一行邏輯：呼叫 nova。
# 規則本身全部登記在 src/nova/載體/規則表.py，每條都有測試背書。
# YAML 裡的 shell 片段沒辦法測試，等於沒有保證（CLAUDE.md 最高原則一）。
repos:
  - repo: local
    hooks:
      - id: nova-gate-commit
        name: nova 閘 提交
        entry: uv run --no-sync nova 閘 提交
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: nova-commit-msg
        name: nova 檢查提交訊息
        entry: uv run --no-sync nova 檢查提交訊息
        language: system
        stages: [commit-msg]
