<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--底);color:var(--字);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;}
.殼{display:grid;grid-template-columns:320px 1fr;height:100vh;}
.側{background:var(--面);border-right:1px solid var(--線);overflow-y:auto;padding:18px;}
.主{display:flex;flex-direction:column;overflow:hidden;}
.畫布{flex:1;overflow:auto;background:var(--底);position:relative;}
.輸出{border-top:1px solid var(--線);background:var(--面);padding:14px 18px;max-height:32vh;overflow-y:auto;}
h1{font-size:17px;margin:0 0 2px}
.副{color:var(--淡);font-size:12px;margin:0 0 18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--淡);
  margin:20px 0 8px;border-bottom:1px solid var(--線);padding-bottom:5px}
.鈕組{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:12px;background:var(--面2);color:var(--字);
  border:1px solid var(--線);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--藍)}
button.開{background:var(--藍);border-color:var(--藍);color:#0B1220;font-weight:600}
label.勾{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;font-size:13px}
label.勾:hover{color:var(--藍)}
input[type=checkbox]{accent-color:var(--藍);width:15px;height:15px}
.點{width:9px;height:9px;border-radius:50%;flex:none}
.統計{display:flex;gap:14px;font-size:12px;color:var(--淡);margin:10px 0 0}
.統計 b{font-size:17px;display:block;color:var(--字);font-variant-numeric:tabular-nums}
.註列{background:var(--面2);border:1px solid var(--線);border-left:3px solid var(--紫);
  border-radius:0 7px 7px 0;padding:8px 10px;margin:7px 0;font-size:12px}
.註列 .名{font-weight:600;color:var(--紫)}
.註列 .刪{float:right;background:none;border:none;color:var(--淡);cursor:pointer;padding:0 2px}
pre{background:var(--底);border:1px solid var(--線);border-radius:8px;padding:12px;
  font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:8px 0 0;max-height:20vh;overflow:auto}
.列{display:flex;align-items:center;justify-content:space-between;gap:10px}
svg{display:block}
.節點{cursor:pointer}
.節點:hover rect{stroke-width:2.4}
.罩{position:fixed;inset:0;background:#000A;display:none;align-items:center;justify-content:center;z-index:9}
.罩.開{display:flex}
.窗{background:var(--面);border:1px solid var(--線);border-radius:12px;padding:20px;width:min(520px,92vw)}
textarea{width:100%;min-height:110px;background:var(--底);color:var(--字);border:1px solid var(--線);
  border-radius:8px;padding:10px;font:13px/1.6 inherit;resize:vertical}
.工具列{display:flex;gap:8px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--線);background:var(--面);font-size:12px;color:var(--淡)}

</head>

<script>

// 一格「部分」可能是可做，也可能卡在別人身上。混成一個欄位就分不出
// 「還沒輪到」與「推不動」，而那兩件事該做的處置完全不同。

const 排色 = {可做:"#4ADE80", 卡住:"#F87171", 押後:"#9B938B", 決定:"#60A5FA"};
const 排記 = {可做:"▶", 卡住:"⛔", 押後:"⏳", 決定:"✓"};
const 排解 = {
  可做:"沒有前置擋著，現在就能動手",
  卡住:"有前置沒完成，卡在誰寫在格子裡",
  押後:"不管能不能做都排到後面，觸發條件寫在格子裡",
  決定:"停在這裡是人的決定，不是缺口——要動要先改主意",
};

const 線色 = {流:"#60A5FA", 事件:"#F87171", 呼叫:"#4ADE80"};
const 線樣 = {流:"", 事件:"5 4", 呼叫:"8 4"};

const 層清單 = [
  {鍵:"閘",   名:"殼 A：閘（對寫 code 的 agent）"},
  {鍵:"觸發", 名:"事件源（四種都收斂成一個函式呼叫）"},
  {鍵:"核",   名:"執行核＝殼 B（對被委派的 LLM）"},
  {鍵:"h",    名:"h 的實作（claude/codex/agy 平級）"},
  {鍵:"契約", 名:"契約（跨層 schema）"},
  {鍵:"落盤", 名:"落盤（你隨時能 cat）"},
  {鍵:"迴圈", 名:"迴圈：角色與工作流（骨架）"},
];

const 預設 = {
  "全部":       {層:["閘","觸發","核","h","契約","落盤","迴圈"], 態:["好","半","無"]},

  "已完成的殼": {層:["閘","契約"],                         態:["好","半","無"]},
};

const 態 = {層:{}, 態:{}, 排:{}, 註:[], 預設:"全部", 倍:1};
層清單.forEach(l=>態.層[l.鍵]=true);
Object.keys(狀).forEach(k=>態.態[k]=true);
Object.keys(排).forEach(k=>態.排[k]=true);

const 找 = id => 節點.find(n=>n.id===id);
const 看得到 = n => 態.層[n.層] && 態.態[n.態] && (!n.排 || 態.排[n.排]);

function 建側欄(){
  const 預設鈕 = document.getElementById("預設鈕");
  預設鈕.innerHTML = Object.keys(預設).map(k=>
    `<button data-k="${k}" onclick="套預設('${k}')">${k}</button>`).join("");
  document.getElementById("狀態勾").innerHTML = Object.entries(狀).map(([k,v])=>
    `<label class="勾"><input type="checkbox" ${態.態[k]?"checked":""} onchange="態.態['${k}']=this.checked;態.預設='';畫()">
     <span class="點" style="background:${色[k]}"></span>${v}</label>`).join("");
  document.getElementById("排勾").innerHTML = Object.entries(排).map(([k,v])=>
    `<label class="勾" title="${排解[k]}"><input type="checkbox" ${態.排[k]?"checked":""} onchange="態.排['${k}']=this.checked;態.預設='';畫()">
     <span class="點" style="background:${排色[k]}"></span>${排記[k]} ${v}</label>`).join("");
  document.getElementById("層勾").innerHTML = 層清單.map(l=>
    `<label class="勾"><input type="checkbox" ${態.層[l.鍵]?"checked":""} onchange="態.層['${l.鍵}']=this.checked;態.預設='';畫()">${l.名}</label>`).join("");
}

function 套預設(k){
  const p = 預設[k]; 態.預設 = k;
  層清單.forEach(l=>態.層[l.鍵] = p.層.includes(l.鍵));
  Object.keys(狀).forEach(s=>態.態[s] = p.態.includes(s));
  // 預設只選層與態；排一律全開，不然切預設會莫名少格子。
  Object.keys(排).forEach(k=>態.排[k] = true);
  建側欄(); 畫();
}

function 縮放(d){ 態.倍 = d===0 ? 1 : Math.min(2, Math.max(0.4, 態.倍+d)); 畫(); }

function 邊(n){ return {左:n.x, 右:n.x+n.w, 上:n.y, 下:n.y+n.h, 中x:n.x+n.w/2, 中y:n.y+n.h/2}; }

function 畫(){
  const svg = document.getElementById("圖");
  const 寬 = 1240, 高 = 1320;
  svg.setAttribute("viewBox", `0 0 ${寬} ${高}`);
  svg.setAttribute("width", 寬*態.倍); svg.setAttribute("height", 高*態.倍);
  document.getElementById("倍率").textContent = Math.round(態.倍*100)+"%";

  let s = `<defs>`;
  Object.entries(線色).forEach(([t,c])=>{
    s += `<marker id="箭${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
  });
  s += `</defs>`;

  // 區塊底
  const 區 = [
    {鍵:"閘", x:20, y:30, w:1180, h:104, 標:"殼 A ── 對「寫 code 的 agent」而言，這已經是殼", 色:"#4ADE80"},
    {鍵:"觸發",x:20, y:200, w:990, h:100, 標:"事件源 ── 四種事件都收斂成同一個函式呼叫", 色:"#F87171"},
    {鍵:"核", x:20, y:330, w:990, h:280, 標:"殼 B：執行核 ── 對「被委派的 LLM」而言，這才是殼（大部分還沒建）", 色:"#C084FC"},
    {鍵:"h",  x:20, y:640, w:990, h:150, 標:"h 的實作 ── claude／codex／agy 平級；一串 h 也是一個 h（接力）", 色:"#60A5FA"},
    {鍵:"契約",x:20, y:806, w:990, h:104, 標:"契約 ── 跨層一律 schema 化", 色:"#FBBF24"},
    {鍵:"落盤",x:20, y:868, w:990, h:104, 標:"落盤 ── 你隨時能 cat 的檔案", 色:"#9B938B"},
  ];
  區.forEach(z=>{
    if(!態.層[z.鍵]) return;
    s += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="14" fill="${z.色}0F" stroke="${z.色}44" stroke-width="1.2"/>`;
    s += `<text x="${z.x+16}" y="${z.y+22}" fill="${z.色}" font-size="12.5" font-weight="700">${z.標}</text>`;
  });

  // 連線
  連線.forEach(c=>{
    const a = 找(c.從), b = 找(c.到);
    if(!a||!b||!看得到(a)||!看得到(b)) return;
    const A = 邊(a), B = 邊(b);
    const d = `M ${A.中x} ${A.下} C ${A.中x} ${A.下+40}, ${B.中x} ${B.上-40}, ${B.中x} ${B.上}`;
    s += `<path d="${d}" fill="none" stroke="${線色[c.型]}" stroke-width="1.4" opacity=".55"
           stroke-dasharray="${線樣[c.型]}" marker-end="url(#箭${c.型})"/>`;
    if(c.標) s += `<text x="${(A.中x+B.中x)/2}" y="${(A.下+B.上)/2}" fill="${線色[c.型]}" font-size="11" text-anchor="middle">${c.標}</text>`;
  });

  // 節點
  節點.filter(看得到).forEach(n=>{
    const 有註 = 態.註.some(z=>z.目標===n.id);
    const c = 色[n.態];
    s += `<g class="節點" onclick="開窗('${n.id}')">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="9"
        fill="#1B1917" stroke="${有註?"#C084FC":c}" stroke-width="${有註?2.6:1.5}"/>
      <circle cx="${n.x+13}" cy="${n.y+15}" r="4.5" fill="${c}"/>
      <text x="${n.x+26}" y="${n.y+19}" fill="#E8E3DD" font-size="12.5" font-weight="600">${n.標}</text>
      <text x="${n.x+12}" y="${n.y+36}" fill="#9B938B" font-size="10.5">${n.副}</text>
      ${n.排 ? `<text x="${n.x+n.w-9}" y="${n.y+19}" text-anchor="end" fill="${排色[n.排]}" font-size="11" font-weight="700">${排記[n.排]}</text>` : ""}
    </g>`;
  });

  svg.innerHTML = s;
  更新統計(); 更新註區(); 更新提示();
  document.querySelectorAll("#預設鈕 button").forEach(b=>
    b.classList.toggle("開", b.dataset.k===態.預設));
}

function 更新統計(){
  const 全 = 節點.filter(n=>態.層[n.層]);
  const 數 = k => 全.filter(n=>n.態===k).length;
  document.getElementById("統計").innerHTML = Object.entries(狀).map(([k,v])=>
    `<div><b style="color:${色[k]}">${數(k)}</b>${v}</div>`).join("");
  const 排數 = k => 全.filter(n=>n.排===k).length;
  document.getElementById("排統計").innerHTML = Object.entries(排).map(([k,v])=>
    `<div title="${排解[k]}"><b style="color:${排色[k]}">${排數(k)}</b>${v}</div>`).join("");
}

let 目前 = null;
function 開窗(id){
  目前 = 找(id);
  document.getElementById("窗標").textContent = 目前.標;
  const 排字 = 目前.排 ? `${排記[目前.排]} ${排[目前.排]}` + (目前.卡在 ? `（卡在：${目前.卡在}）` : "") + " ── " : "";
  document.getElementById("窗副").textContent = 排字 + 目前.副 + (目前.註 ? " ── " + 目前.註 : "");
  const 舊 = 態.註.find(z=>z.目標===id);
  document.getElementById("窗文").value = 舊 ? 舊.文 : "";
  document.getElementById("罩").classList.add("開");
  document.getElementById("窗文").focus();
}
function 關窗(){ document.getElementById("罩").classList.remove("開"); 目前=null; }
function 存註(){
  const 文 = document.getElementById("窗文").value.trim();
  態.註 = 態.註.filter(z=>z.目標!==目前.id);
  if(文) 態.註.push({目標:目前.id, 標:目前.標, 副:目前.副, 態:目前.態, 文});
  關窗(); 畫();
}
function 刪註(id){ 態.註 = 態.註.filter(z=>z.目標!==id); 畫(); }

function 更新註區(){
  document.getElementById("註數").textContent = 態.註.length;
  document.getElementById("註空").style.display = 態.註.length ? "none" : "block";
  document.getElementById("註區").innerHTML = 態.註.map(z=>
    `<div class="註列"><button class="刪" onclick="刪註('${z.目標}')">✕</button>
     <div class="名">${z.標}</div><div style="color:var(--淡)">${z.文}</div></div>`).join("");
}

function 更新提示(){
  const 開層 = 層清單.filter(l=>態.層[l.鍵]).map(l=>l.名.split("──")[0].split("（")[0].trim());
  const 全 = 節點.filter(n=>態.層[n.層]);
  const 數 = k => 全.filter(n=>n.態===k).length;
  let t = `這是 nova 宿主反轉路線圖上我圈出來的部分。\n\n`;
  t += `目前看的是：${開層.join("、")}（已完成 ${數("好")}、部分 ${數("半")}、未做 ${數("無")}）。\n`;
  if(態.註.length===0){
    t += `\n我還沒圈任何一格——先幫我確認這張圖跟你理解的一致嗎？有沒有畫錯或漏掉的。`;
  }else{
    t += `\n我要推進的部分：\n`;
    態.註.forEach(z=>{
      t += `\n**${z.標}**（${z.副}・目前 ${狀[z.態]}）\n${z.文}\n`;
    });
    t += `\n請照 nova 的規矩做：先寫會紅的測試、看到它紅、再寫最少的實作，最後附固定負控。`;
  }
  document.getElementById("提示").textContent = t;
}

function 複製(){
  navigator.clipboard.writeText(document.getElementById("提示").textContent).then(()=>{
    const b = document.getElementById("複製鈕"); b.textContent = "已複製！";
    setTimeout(()=>b.textContent="複製", 1400);
  });
}

function 切細節(){
  const 區 = document.getElementById("細節區"), 開 = 區.style.display === "none";
  區.style.display = 開 ? "block" : "none";
  document.getElementById("展開鈕").textContent = 開 ? "收起細節圖" : "展開細節圖（48 格・現在做到哪）";
  if(開) 畫();
}
建側欄(); 套預設("全部");
</script>
