[project]
name = "nova"
version = "0.1.0"
description = "宿主反轉架構：nova = harness engineering[loop engineering[llm]]"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
# 執行檔名用 ASCII（CLAUDE.md 的 CLI executable 例外）；模組路徑用中文沒問題
nova = "nova.載體.命令列:主程式"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.6.2",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=4.1.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
]

# pytest 官方對新專案的建議：測試放在套件外、用 importlib 匯入模式
# https://docs.pytest.org/en/stable/explanation/goodpractices.html
[tool.pytest.ini_options]
testpaths = ["tests"]
# 刻意不放 -n：強制平行會毀掉 TDD 內圈（worker 啟動成本吃掉 pre-commit 的秒級預算，
# 而且 -x 在平行下語義會劣化）。平行只由閘的規則定義開啟，見 src/nova/載體/規則表.py
# 預設排除 真cli：`uv run pytest` 不該偷偷燒 token。要跑就明寫 -m 真cli（後給的 -m 會蓋掉）。
addopts = "--import-mode=importlib -ra --strict-markers --strict-config -m \"not 真cli\""
markers = [
    "serial: 不可與其他測試平行跑（會搶同一份資源，例如檔案系統或巢狀 pytest）",
    "真cli: 真的呼叫外部 LLM CLI（會燒 token、需要認證）。兩個閘都排除，手動 -m 真cli 跑",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ 放的是外部規格原文，一個字都不准被格式化工具改寫
extend-exclude = ["docs"]

[tool.ruff.lint]
# KISS／SRP／YAGNI 能機械化的部分：複雜度、參數數量、分支數、死程式碼、未用參數。
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "C4", "C90", "PL", "ARG", "RET",
    "ERA", "TID", "PTH", "D", "ANN", "S", "A", "ISC", "T20", "TRY", "PERF",
    "PIE", "SLF", "DTZ", "EM", "G", "LOG", "RSE", "FURB",
]
ignore = [
    # 以下四組內建「識別字只能是英文、標點只能是半形」的假設，
    # 與 CLAUDE.md 的繁體中文命名規則直接衝突。不要「修好」它們。
    "N",                                  # pep8-naming：中文函式／類別名一律報錯
    "PLC2401", "PLC2403",                 # 非 ASCII 識別字
    "RUF001", "RUF002", "RUF003",         # 把全形標點當可疑字元
    # 中文句號是「。」不是「.」，D400／D415 的判準不適用
    "D203", "D213", "D400", "D415",
    "D403",                               # 首字大寫是英文慣例，中文 docstring 不適用
    "ISC001",                             # 與 formatter 衝突
]

[tool.ruff.lint.mccabe]
# KISS 的機械化門檻：一個函式的分支複雜度上限。超過就該拆。
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# CLI 的職責就是把結果印給人看，print 是它的介面而不是遺留的除錯碼。
"src/nova/載體/命令列.py" = ["T201"]
# 測試裡 assert 是介面本身；魔術數字是測資；docstring 由測試名稱承擔。
"tests/**" = [
    "S101", "D100", "D101", "D102", "D103", "D104",
    "FBT001", "FBT002", "FBT003", "PLR2004", "ANN401", "SLF001", "S603", "S607",
]

[tool.mypy]
files = ["src", "tests"]
strict = true
