[project]
name = "nova"
version = "0.1.0"
description = "宿主反轉架構：nova = harness engineering[loop engineering[llm]]"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
# 執行檔名用 ASCII（CLAUDE.md 的 CLI executable 例外）；模組路徑用中文沒問題
nova = "nova.載體.命令列:主程式"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.6.2",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=4.1.0",
]

# pytest 官方對新專案的建議：測試放在套件外、用 importlib 匯入模式
# https://docs.pytest.org/en/stable/explanation/goodpractices.html
[tool.pytest.ini_options]
testpaths = ["tests"]
# 刻意不放 -n：強制平行會毀掉 TDD 內圈（worker 啟動成本吃掉 pre-commit 的秒級預算，
# 而且 -x 在平行下語義會劣化）。平行只由閘的規則定義開啟，見 src/nova/載體/規則表.py
addopts = "--import-mode=importlib -ra --strict-markers --strict-config"
markers = [
    "serial: 不可與其他測試平行跑（會搶同一份資源，例如檔案系統或巢狀 pytest）",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ 放的是外部規格原文，一個字都不准被格式化工具改寫
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src", "tests"]
strict = true
