# 四道閘。job 名 `gates` 就是 required status check 的 context 名稱，
# 屬於 CLAUDE.md 的「跨程序 semantic id」ASCII 例外，改名會讓 main 的保護規則失效。
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安裝 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # 預設是 false，於是每一趟都重新下載 33.2 MiB 的 CPython
          # （log 原文：`Downloading cpython-3.13.15-linux-x86_64-gnu (download) (33.2MiB)`）。
          # 版本由 .python-version 釘死，根本不會變——重下純粹是浪費。
          cache-python: true

      - name: 安裝相依（鎖檔為準）
        run: uv sync --locked

      # actions/checkout 預設 fetch-depth: 1，沒有 origin/main 可以比。
      # test-count 要跟 base branch 比，不然 CI 上工作區 == HEAD，整條規則空轉。
      - name: 抓 base branch 當測試數基準
        run: git fetch --no-tags --depth=1 origin main

      # 只有一行：規則全部登記在 src/nova/載體/規則表.py，每條都有測試背書。
      # --全部跑完 讓 CI 一次回報所有紅的，不要修一條推一次。
      - name: nova 閘 ci
        run: uv run nova 閘 ci --全部跑完
        env:
          NOVA_TEST_COUNT_BASE: origin/main
