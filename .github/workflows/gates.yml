# 四道閘。job 名 `gates` 就是 required status check 的 context 名稱，
# 屬於 CLAUDE.md 的「跨程序 semantic id」ASCII 例外，改名會讓 main 的保護規則失效。
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安裝 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: 安裝相依（鎖檔為準）
        run: uv sync --locked

      - name: 閘一 ruff check
        run: uv run ruff check .

      - name: 閘二 ruff format
        run: uv run ruff format --check .

      - name: 閘三 mypy
        run: uv run mypy

      - name: 閘四 pytest
        run: uv run pytest
